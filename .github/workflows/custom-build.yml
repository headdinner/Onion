name: Custom build

on:
  push:
    branches: [custom]
  workflow_dispatch:

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain:latest
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          source /root/.bashrc
          make release
      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: onion-${{ github.ref_name }}-${{ github.run_number }}
          path: release/*.zip
          retention-days: 30
          compression-level: 0
